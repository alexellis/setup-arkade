name: 'Install arkade'
description: 'Install arkade'
branding:
  icon: 'arrow-right-circle'
  color: 'gray-dark'
runs:
    using: 'composite'
    steps:
      - name: Install Install
        shell: bash
        id: download
        run: |
          if ! [ -x "$(command -v curl)" ]; then
            sudo apt update && sudo apt install -qy curl
          fi

          curl -sLS https://get.arkade.dev | sudo sh

          echo "PATH=$HOME/.arkade/bin:$PATH" >> $GITHUB_ENV

      - name: Ensure /usr/local/bin is on PATH
        shell: bash
        run: |
          # Some minimal runner images do not include /usr/local/bin on
          # PATH, where the install script places arkade.
          case ":$PATH:" in
            *":/usr/local/bin:"*) ;;
            *) echo "/usr/local/bin" >> $GITHUB_PATH ;;
          esac
